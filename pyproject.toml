[project]
name = "txlabel"
version = "0.1.0"
description = "Card transaction labeling (PFM): training pipeline and prediction API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txlabel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
